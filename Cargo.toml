[package]
name = "kanab"
description = "A kanban CLI tool."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
uuid = { version = "1.23.0", features = ["v4", "serde"] }
ratatui = "0.30.0"
crossterm = "0.29.0"
color-eyre = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
directories = "6.0.0"
serde_json = "1.0.149"
