[package]
name = "kannab"
description = "A kanban CLI tool."
version = "0.1.2"
edition = "2024"
license = "MIT"

[dependencies]
uuid = { version = "1.23.0", features = ["v4", "serde"] }
ratatui = { version = "0.30.0", features = ["serde"] }
crossterm = "0.29.0"
color-eyre = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
directories = "6.0.0"
serde_json = "1.0.149"
toml = "1.1.2"
