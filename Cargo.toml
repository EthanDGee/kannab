[package]
description = "A kanban TUI built around vim navigation and a polished user experience."
name = "kannab"
repository = "https://github.com/EthanDGee/kannab"
version = "0.3.6"
edition = "2024"
license = "MIT"

[dependencies]
uuid = { version = "1.23.0", features = ["v4", "serde"] }
ratatui = { version = "0.30.0", features = ["serde"] }
crossterm = "0.29.0"
color-eyre = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
directories = "6.0.0"
serde_json = "1.0.149"
toml = "1.1.2"
ratatui-textarea = "0.9.1"
clap = { version = "4.6.1", features = ["derive"] }
